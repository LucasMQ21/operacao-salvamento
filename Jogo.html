.mapa-wrapper { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; }
.mapa-container { position:relative; width:min(92vw,85vh); height:min(92vw,85vh); max-width:900px; max-height:900px; }
.ruas-svg { position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }
.rua-borda { fill:none; stroke:#3a3a3a; stroke-width:32; stroke-linecap:round; } .rua { fill:none; stroke:#555; stroke-width:26; stroke-linecap:round; filter:drop-shadow(0 2px 4px rgba(0,0,0,.25)); } .rua-faixa { fill:none; stroke:#888; stroke-width:2.5; stroke-dasharray:10 10; stroke-linecap:round; }

.ocorrencia { position:absolute; width:clamp(80px,13%,130px); height:clamp(80px,13%,130px); cursor:pointer; z-index:10; transition:.35s cubic-bezier(.34,1.56,.64,1), filter .3s; transform:translate(-50%,-50%); }

.ocorrencia-img { width:100%; height:100%; border-radius:50%; object-fit:cover; border:5px solid #fff; box-shadow:0 6px 20px rgba(0,0,0,.3),0 0 0 3px rgba(255,255,255,.15); background:#fff; }
.ocorrencia:not(.completa):before { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:100%; height:100%; border-radius:50%; border:3px solid rgba(255,215,0,.4); animation:pulseRing 2.5s ease-out infinite; pointer-events:none; }

#tela-missao { display:none; height:100vh; width:100vw; background:#0d1b2a; color:#fff; flex-direction:column; overflow:hidden; }

.fade-in { animation:fadeIn .45s ease; } @keyframes fadeIn { from{opacity:0} to{opacity:1} }

<body>
<div id="tela-inicial">
  <div class="logo-area"><div class="escudo-bombeiro"><span>🚒</span></div><h1>Bombeiro <span>Matemático</span></h1><p>Resolva desafios para salvar vidas!</p></div>
  <div class="form-inicial"><label for="nome-guerra">Digite seu nome:</label><input type="text" id="nome-guerra" placeholder="Ex: Silva" maxlength="20" autocomplete="off"><button class="btn-entrar" onclick="entrarNoJogo()">🔥 Entrar em Serviço</button></div>
</div>
<div id="tela-mapa">

d="ocorrencia-1" data-missao="1" onclick="selecionarMissao(1)" title="🌊 Missão 2: Resgate na Água"><img src="https://cdn.oreateai.com/aiimage/upload/ec5e1ad3acd034ed1dfb296c/4cb1c43b39bb3b84c6bd0be3d390fc5b.png" alt="Missão 2" class="ocorrencia-img"></div><div class="ocorrencia" id="ocorrencia-2" data-missao="2" onclick="selecionarMissao(2)" title="🕳️ Missão 3: Galeria Subterrânea"><img src="https://cdn.oreateai.com/aiimage/upload/ec5e1ad3acd034ed1dfb296c/b52bef1e3a1a4272daaada7476ce1a91.png" alt="Missão 3" class="ocorrencia-img"></div><div class="ocorrencia" id="ocorrencia-3" data-missao="3" onclick="selecionarMissao(3)" title="🌲 Missão 4: Buscas na Mata"><img src="https://cdn.oreateai.com/aiimage/upload/ec5e1ad3acd034ed1dfb296c/c6e15c98b1fefd3a4a3bab8f1caf5750.png" alt="Missão 4" class="ocorrencia-img"></div><div class="ocorrencia" id="ocorrencia-4" data-missao="4" onclick="selecionarMissao(4)" title="🔥 Missão 5: Combate ao Incêndio"><img src="https://cdn.oreateai.com/aiimage/upload/ec5e1ad3acd034ed1dfb296c/731bdb67244603584ad13c0c4752cdc6.png" alt="Missão 5" class="ocorrencia-img"></div><div class="ocorrencia" id="ocorrencia-5" data-missao="5" onclick="selecionarMissao(5)" title="💧 Missão 6: Busca Aquática em Cachoeira"><img src="https://cdn.oreateai.com/aiimage/upload/ec5e1ad3acd034ed1dfb296c/92af714a4713bcf75dc4a3ba987052f5.png" alt="Missão 6" class="ocorrencia-img"></div></div></div><div class="instrucao-mapa">🖱️ Clique em uma ocorrência para acionar a sirene e enviar o caminhão!</div></div>

let nomeJogador=''; let missaoAtual=null; let animando=false; let sireneAudioCtx=null; let missionStart=0; let missionTimerRAF=null; let missionAttempts=0;
const MAPA_SIZE=900, CENTRO=450, RAIO=330;
document.addEventListener('DOMContentLoaded',()=>{ desenharRuas(); posicionarOcorrencias(); atualizarContador(); window.addEventListener('resize',()=>{desenharRuas(); posicionarOcorrencias();}); document.getElementById('nome-guerra').addEventListener('keypress',e=>{ if(e.key==='Enter') entrarNoJogo(); }); });
function desenharRuas(){ const svg=document.getElementById('ruas-svg'); svg.innerHTML=''; MISSOES.forEach((_,index)=>{ const ang=(index*60-90)*Math.PI/180; const x2=CENTRO+RAIO*Math.cos(ang); const y2=CENTRO+RAIO*Math.sin(ang); ['rua-borda','rua','rua-faixa'].forEach(cls=>{ const line=document.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('x1',CENTRO); line.setAttribute('y1',CENTRO); line.setAttribute('x2',x2); line.setAttribute('y2',y2); line.setAttribute('class',cls); svg.appendChild(line); }); }); }
function posicionarOcorrencias(){ MISSOES.forEach((_,index)=>{ const el=document.getElementById(`ocorrencia-${index}`); if(!el)return; const ang=(index*60-90)*Math.PI/180; const x=50+(RAIO/(MAPA_SIZE/2))*50*Math.cos(ang); const y=50+(RAIO/(MAPA_SIZE/2))*50*Math.sin(ang); el.style.left=x+'%'; el.style.top=y+'%'; }); }
function entrarNoJogo(){ const input=document.getElementById('nome-guerra'); nomeJogador=input.value.trim(); if(!nomeJogador){ input.style.borderColor='#ff4444'; input.placeholder='Digite seu nome!'; setTimeout(()=>{input.style.borderColor='';input.placeholder='Ex: Silva';},1500); return; } document.getElementById('nome-display').textContent=nomeJogador; trocarTela('tela-inicial','tela-mapa'); }
function voltarTelaInicial(force=false){ if(!force && !confirm('Deseja realmente sair? Seu progresso será perdido!')) return; MISSOES.forEach(m=>m.resolvida=false); document.querySelectorAll('.ocorrencia').forEach(el=>el.classList.remove('completa')); document.getElementById('nome-guerra').value=''; atualizarContador(); pararTimerMissao(); document.getElementById('missionFrame').src='about:blank'; esconderTodas(); document.getElementById('tela-inicial').style.display='flex'; }
function tocarSirene(){ try{ if(!sireneAudioCtx) sireneAudioCtx=new (window.AudioContext||window.webkitAudioContext)(); const ctx=sireneAudioCtx, o1=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(); g.connect(ctx.destination); o1.connect(g); o2.connect(g); o1.type='square'; o2.type='sawtooth'; const now=ctx.currentTime; [o1,o2].forEach((o,k)=>{ o.frequency.setValueAtTime(600+k*5,now); o.frequency.linearRampToValueAtTime(900+k*5,now+.15); o.frequency.linearRampToValueAtTime(600+k*5,now+.3); o.frequency.linearRampToValueAtTime(900+k*5,now+.45); o.frequency.linearRampToValueAtTime(600+k*5,now+.6); o.frequency.linearRampToValueAtTime(900+k*5,now+.75); o.frequency.linearRampToValueAtTime(600+k*5,now+.9); o.start(now); o.stop(now+1); }); g.gain.setValueAtTime(.10,now); g.gain.exponentialRampToValueAtTime(.001,now+1); }catch(e){} }
function ligarSireneVisual(){ document.getElementById('sireneLuz').classList.add('sirene-ligada'); document.getElementById('sireneRaio').style.display='block'; }
function desligarSireneVisual(){ document.getElementById('sireneLuz').classList.remove('sirene-ligada'); document.getElementById('sireneRaio').style.display='none'; }
function selecionarMissao(id){ if(animando)return; if(MISSOES[id].resolvida && !confirm('Esta missão já foi concluída. Deseja abri-la novamente?')) return; animando=true; missaoAtual=id; document.querySelectorAll('.ocorrencia').forEach(o=>{ if(parseInt(o.dataset.missao)!==id){ o.style.pointerEvents='none'; o.style.opacity='.5'; } }); tocarSirene(); ligarSireneVisual(); setTimeout(()=>{ desligarSireneVisual(); moverCaminhaoPara(id); },1000); }
function moverCaminhaoPara(id){ const cam=document.getElementById('caminhao'), oc=document.getElementById(`ocorrencia-${id}`), cont=document.getElementById('mapa-container'); const cr=cont.getBoundingClientRect(), or=oc.getBoundingClientRect(); const sx=cr.width/2, sy=cr.height/2, dx=or.left-cr.left+or.width/2, dy=or.top-cr.top+or.height/2; const ang=Math.atan2(dy-sy,dx-sx)*180/Math.PI; cam.style.transition='none'; cam.style.left=sx+'px'; cam.style.top=sy+'px'; cam.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`; cam.classList.add('visivel'); void cam.offsetWidth; cam.style.transition='left 1.6s cubic-bezier(.25,.46,.45,.94), top 1.6s cubic-bezier(.25,.46,.45,.94)'; cam.style.left=dx+'px'; cam.style.top=dy+'px'; setTimeout(()=>{ cam.classList.remove('visivel'); animando=false; abrirMissao(id); },1700); }
function abrirMissao(id){ missaoAtual=id; missionAttempts=0; document.getElementById('missionAttempts').textContent='0'; document.getElementById('missionSolvedStatus').textContent = MISSOES[id].resolvida ? 'Concluída' : 'Em andamento'; document.getElementById('missionTitle').textContent=MISSOES[id].titulo; document.getElementById('missionFrame').src=SIM_URLS[id]; iniciarTimerMissao(); trocarTela('tela-mapa','tela-missao'); }
function reiniciarSimulador(){ if(missaoAtual===null)return; document.getElementById('missionFrame').src='about:blank'; setTimeout(()=>{ document.getElementById('missionFrame').src=SIM_URLS[missaoAtual]; missionAttempts=0; document.getElementById('missionAttempts').textContent='0'; iniciarTimerMissao(); },50); }
function resolverMissao(id){ if(id===null||id===undefined)return; MISSOES[id].resolvida=true; const el=document.getElementById(`ocorrencia-${id}`); if(el)el.classList.add('completa'); document.getElementById('missionSolvedStatus').textContent='Concluída'; atualizarContador(); const total=MISSOES.filter(m=>m.resolvida).length; if(total===MISSOES.length){ setTimeout(()=>alert(`🎉 Parabéns, ${nomeJogador}! Você completou todas as missões.`),250); } else { setTimeout(()=>alert(`✅ Missão concluída! Faltam ${MISSOES.length-total} ocorrências.`),250); } voltarParaMapa(); }
function voltarParaMapa(){ pararTimerMissao(); document.getElementById('missionFrame').src='about:blank'; esconderTodas(); const mapa=document.getElementById('tela-mapa'); mapa.style.display='block'; mapa.classList.add('fade-in'); setTimeout(()=>mapa.classList.remove('fade-in'),500); document.querySelectorAll('.ocorrencia').forEach(o=>{o.style.pointerEvents='';o.style.opacity='';}); missaoAtual=null; }
function atualizarContador(){ document.getElementById('contador-missoes').textContent=`${MISSOES.filter(m=>m.resolvida).length}/${MISSOES.length}`; }
function formatTime(ms){ const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000), s=Math.floor((ms%60000)/1000); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function iniciarTimerMissao(){ pararTimerMissao(); missionStart=Date.now(); function tick(){ document.getElementById('missionTimer').textContent=formatTime(Date.now()-missionStart); missionTimerRAF=requestAnimationFrame(tick); } tick(); }
function pararTimerMissao(){ if(missionTimerRAF) cancelAnimationFrame(missionTimerRAF); missionTimerRAF=null; }
function esconderTodas(){ ['tela-inicial','tela-mapa','tela-missao'].forEach(id=>{ document.getElementById(id).style.display='none'; }); }
function trocarTela(esconderId,mostrarId){ document.getElementById(esconderId).style.display='none'; const mostrar=document.getElementById(mostrarId); mostrar.style.display=mostrarId==='tela-inicial'?'flex':(mostrarId==='tela-missao'?'flex':'block'); mostrar.classList.add('fade-in'); setTimeout(()=>mostrar.classList.remove('fade-in'),500); }
window.addEventListener('message',(ev)=>{ const data=ev.data||{}; if(data.type!=='mission-status' || data.missionId!==missaoAtual) return; if(Number.isFinite(data.attempts)){ missionAttempts=data.attempts; document.getElementById('missionAttempts').textContent=String(missionAttempts); } if(data.success && missaoAtual!==null && !MISSOES[missaoAtual].resolvida){ document.getElementById('missionSolvedStatus').textContent='Sucesso detectado'; } });
</script>
